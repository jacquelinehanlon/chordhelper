<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Guitar Chord Helper</title>

<style>

:root{
 --bg:#1e1e1e;
 --panel:#2b2b2b;
 --panel2:#383838;
 --text:#ffffff;
 --accent:#38a2ff;
 --border:#555;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Segoe UI,sans-serif;
}

header{
 padding:14px;
 font-size:24px;
 font-weight:bold;
 border-bottom:1px solid var(--border);
}

.controls{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 align-items:center;
 padding:10px;
}

button{
 cursor:pointer;
 border:1px solid #666;
 background:#444;
 color:white;
 padding:8px 12px;
 border-radius:6px;
}

button:hover{
 background:#555;
}

#fretboard-container{
 overflow:auto;
 padding:10px;
}

#fretboard{
 position:relative;
 width:1800px;
 height:340px;
 margin:auto;
 background:#b07a44;
 border:8px solid #75502d;
 border-radius:12px;
}

.string{
 position:absolute;
 left:0;
 right:0;
 height:2px;
 background:#ddd;
}

.fret{
 position:absolute;
 top:0;
 bottom:0;
 width:3px;
 background:#ddd;
}

.marker{
 position:absolute;
 width:18px;
 height:18px;
 border-radius:50%;
 background:rgba(255,255,255,.25);
}

.note-cell{
 position:absolute;
 width:44px;
 height:44px;
 transform:translate(-50%,-50%);
 border-radius:50%;
 cursor:pointer;
}

.note-cell.selected{
 background:var(--accent);
 border:3px solid white;
}

.note-label{
 position:absolute;
 inset:0;
 display:flex;
 justify-content:center;
 align-items:center;
 pointer-events:none;
 font-size:12px;
 font-weight:bold;
}

.section{
 padding:10px;
}

.section h2{
 margin:0 0 8px;
}

.scroll-row{
 overflow-x:auto;
 white-space:nowrap;
 border:1px solid var(--border);
 background:var(--panel);
 padding:8px;
 border-radius:8px;
}

.chord-card{
 display:inline-block;
 margin-right:8px;
 min-width:130px;
 padding:8px;
 background:var(--panel2);
 border:1px solid #666;
 border-radius:6px;
 color:white;
}

.footer{
 padding:15px;
 color:#aaa;
}

</style>
</head>
<body>

<header id="header">
Select Notes
</header>

<div class="controls">

<button id="clearBtn">
Clear Selection
</button>

<button id="voicingDown">
◀ Lower Voicing
</button>

<button id="voicingUp">
Higher Voicing ▶
</button>

<label>
<input
 type="checkbox"
 id="showNames"
 checked>
 Show Note Names
</label>

</div>

<div id="fretboard-container">
<div id="fretboard"></div>
</div>

<div class="section">

<h2>Nearby Chords</h2>

<div
 id="nearbyRow"
 class="scroll-row">
</div>

</div>

<script>
const NOTE_NAMES=[
    "C","C#","D","D#","E","F",
    "F#","G","G#","A","A#","B"
];

const OPEN_STRINGS=[
    40, // E2
    45, // A2
    50, // D3
    55, // G3
    59, // B3
    64  // E4
];

const FRETS=22;

/* ----------------------------
   CHORD FORMULAS
----------------------------- */

const CHORD_TYPES={

    "":[0,4,7],

    "m":[0,3,7],

 /*   "dim":[0,3,6],

    "aug":[0,4,8],

    "sus2":[0,2,7],

    "sus4":[0,5,7],

    "6":[0,4,7,9],

    "m6":[0,3,7,9], 

    "7":[0,4,7,10],

    "maj7":[0,4,7,11],

    "m7":[0,3,7,10],

    "m7b5":[0,3,6,10],

    "dim7":[0,3,6,9],

    "add9":[0,2,4,7],

    "madd9":[0,2,3,7],

    "9":[0,4,7,10,14],

    "maj9":[0,4,7,11,14],

    "m9":[0,3,7,10,14],

    "11":[0,4,7,10,14,17],

    "13":[0,4,7,10,14,21] */
};

/* ----------------------------
   CHORD LIBRARY
----------------------------- */

const CHORD_LIBRARY=[];

for(let root=0;root<12;root++){

    for(const [quality,intervals]
        of Object.entries(CHORD_TYPES)){

        CHORD_LIBRARY.push({

            root,

            quality,

            intervals,

            name:
                NOTE_NAMES[root]
                +quality,

            pcs:new Set(
                intervals.map(
                    i=>(root+i)%12
                )
            )

        });

    }
}

/* ----------------------------
   REAL GUITAR VOICINGS
----------------------------- */

const BASE_VOICINGS={

"C":[
[-1,3,2,0,1,0],
[-1,3,5,5,5,3],
[8,10,10,9,8,8]
],

"Cm":[
[-1,3,1,0,1,-1],
[-1,3,5,5,4,3],
[8,10,10,8,8,8]
],

"D":[
[-1,-1,0,2,3,2],
[-1,5,7,7,7,5],
[10,12,12,11,10,10]
],

"Dm":[
[-1,-1,0,2,3,1],
[-1,5,7,7,6,5],
[10,12,12,10,10,10]
],

"E":[
[0,2,2,1,0,0],
[0,7,9,9,9,7],
[12,14,14,13,12,12]
],

"Em":[
[0,2,2,0,0,0],
[0,7,9,9,8,7],
[12,14,14,12,12,12]
],

"F":[
[1,3,3,2,1,1],
[8,8,10,10,10,8]
],

"Fm":[
[1,3,3,1,1,1],
[8,10,10,8,8,8]
],

"G":[
[3,2,0,0,0,3],
[3,5,5,4,3,3],
[10,10,12,12,12,10]
],

"Gm":[
[3,5,5,3,3,3],
[10,12,12,10,10,10]
],

"A":[
[-1,0,2,2,2,0],
[5,7,7,6,5,5],
[12,12,14,14,14,12]
],

"Am":[
[-1,0,2,2,1,0],
[5,7,7,5,5,5],
[12,14,14,12,13,12]
],

"B":[
[-1,2,4,4,4,2],
[7,9,9,8,7,7]
],

"Bm":[
[-1,2,4,4,3,2],
[7,9,9,7,7,7]
]

};

/* ----------------------------
   GENERATE ALL ROOTS
----------------------------- */

function transposeVoicing(
    voicing,
    semitones
){

    return voicing.map(f=>{

        if(f<0) return -1;

        return f+semitones;

    });

}

function rootIndex(name){

    return NOTE_NAMES.indexOf(name);

}

function makeChordKey(rootPc,
                      quality){

    return NOTE_NAMES[rootPc]
           +quality;

}

/* ----------------------------
   MASTER VOICING MAP
----------------------------- */

const VOICINGS={};

Object.entries(BASE_VOICINGS)
.forEach(([name,list])=>{

    const match=
        name.match(
            /^([A-G]#?)(.*)$/
        );

    if(!match) return;

    const rootName=
        match[1];

    const quality=
        match[2];

    const rootPc=
        rootIndex(rootName);

    for(let target=0;
        target<12;
        target++){

        const diff=
            target-rootPc;

        const key=
            makeChordKey(
                target,
                quality
            );

        if(!VOICINGS[key])
            VOICINGS[key]=[];

        list.forEach(v=>{

            const newShape=
                transposeVoicing(
                    v,
                    diff
                );

            const valid=
                newShape.every(f=>
                    f<0 ||
                    f<=22
                );

            if(valid){

                VOICINGS[key]
                .push(newShape);

            }

        });

    }

});

/* ----------------------------
   APP STATE
----------------------------- */

const selectedPositions=
    new Set();

const noteData=
    new Map();

const noteElements=
    new Map();

let currentChord=null;

let currentVoicingIndex=0;

let currentVoicingList=[];

let currentBass=null;
/* =====================================================
   FRETBOARD CONSTRUCTION
===================================================== */

const fretboard =
    document.getElementById(
        "fretboard"
    );

function buildFretboard(){

    const width = 1800;

    const fretSpacing =
        (width - 80) /
        (FRETS + 1);

    /* strings */

    for(let string=0;
        string<6;
        string++){

        const y =
            40 +
            string*52;

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "string";

        div.style.top =
            y+"px";

        fretboard.appendChild(
            div
        );
    }

    /* frets */

    for(let fret=0;
        fret<=FRETS;
        fret++){

        const x =
            40 +
            fret *
            fretSpacing;

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "fret";

        div.style.left =
            x+"px";

        fretboard.appendChild(
            div
        );
    }

    /* markers */

    [
        3,5,7,9,
        15,17,19,21
    ]
    .forEach(f=>{

        const m =
            document.createElement(
                "div"
            );

        m.className =
            "marker";

        m.style.left =
            (
                40 +
                (f-.5)
                *
                fretSpacing
                - 9
            ) + "px";

        m.style.top =
            "160px";

        fretboard.appendChild(
            m
        );
    });

    /* octave */

    [110,210]
    .forEach(y=>{

        const m =
            document.createElement(
                "div"
            );

        m.className =
            "marker";

        m.style.left =
            (
             40 +
             (12-.5)
             *
             fretSpacing
             - 9
            ) + "px";

        m.style.top =
            y + "px";

        fretboard.appendChild(m);

    });

    /* notes */

    for(let string=0;
        string<6;
        string++){

        const y =
            40 +
            string*52;

        for(let fret=0;
            fret<=FRETS;
            fret++){

            const x =
                40 +
                fret*fretSpacing
                -
                fretSpacing/2;

            const midi =
                OPEN_STRINGS
                [
                 5-string
                ]
                +
                fret;

            const pc =
                midi % 12;

            const key =
                string
                +
                "-"
                +
                fret;

            const note=
                document.createElement(
                    "div"
                );

            note.className =
                "note-cell";

            note.style.left =
                x+"px";

            note.style.top =
                y+"px";

            const label=
                document.createElement(
                    "div"
                );

            label.className=
                "note-label";

            label.textContent=
                NOTE_NAMES[pc];

            note.appendChild(
                label
            );

            note.addEventListener(
                "click",
                ()=>{

                    if(
                        selectedPositions
                        .has(key)
                    ){

                        selectedPositions
                        .delete(key);

                    }else{

                        selectedPositions
                        .add(key);

                    }

                    refresh();

                }
            );

            noteData.set(
                key,
                {
                    key,
                    string,
                    fret,
                    midi,
                    pc
                }
            );

            noteElements.set(
                key,
                note
            );

            fretboard.appendChild(
                note
            );

        }
    }
}

/* =====================================================
   HELPERS
===================================================== */

function selectedPitchClasses(){

    return new Set(

        [...selectedPositions]
        .map(k=>
            noteData
            .get(k)
            .pc
        )

    );
}

function selectedMidiNotes(){

    return

    [...selectedPositions]
    .map(k=>
        noteData
        .get(k)
        .midi
    );
}

function setsEqual(a,b){

    if(a.size!==b.size)
        return false;

    for(const x of a){

        if(!b.has(x))
            return false;

    }

    return true;
}

/* =====================================================
   CHORD MATCHING
===================================================== */

function chordMatchScore(
    chord,
    selectedPcs
){

    let common=0;
    let missing=0;
    let extra=0;

    selectedPcs.forEach(pc=>{

        if(
            chord.pcs.has(pc)
        ){

            common++;

        }else{

            extra++;

        }

    });

    chord.pcs.forEach(pc=>{

        if(
          !selectedPcs
          .has(pc)
        ){

            missing++;

        }

    });

    return (

        common*12

        -

        missing*3

        -

        extra*4

    );
}

function bestChordMatch(){

    const pcs =
        selectedPitchClasses();

    let best=null;
    let score=-99999;

    CHORD_LIBRARY
    .forEach(chord=>{

        const s=
            chordMatchScore(
                chord,
                pcs
            );

        if(s>score){

            score=s;
            best=chord;

        }

    });

    return best;
}

function exactChordMatches(){

    const pcs =
        selectedPitchClasses();

    return CHORD_LIBRARY
    .filter(
        chord=>
        setsEqual(
            pcs,
            chord.pcs
        )
    );
}

/* =====================================================
   UI REFRESH
===================================================== */

function refresh(){

    const showNames =
        document
        .getElementById(
            "showNames"
        )
        .checked;

    noteElements
    .forEach(
        (div,key)=>{

            div.classList
            .toggle(

                "selected",

                selectedPositions
                .has(key)

            );

            div
            .querySelector(
                ".note-label"
            )
            .style.display=

                showNames

                ? "flex"

                : "none";

        }
    );

    const exact =
        exactChordMatches();

    const header=
        document
        .getElementById(
            "header"
        );

    if(exact.length){

        header.textContent =
            exact
            .map(
                c=>c.name
            )
            .join(", ");

    }else if(
        selectedPositions.size
    ){

        const best =
            bestChordMatch();

        header.textContent =

            "Closest Match: "

            +

            best.name;

    }else{

        header.textContent =
            "Select Notes";

    }

    buildNearbyChords();
}
/* =====================================================
   NEARBY CHORD GENERATION
===================================================== */

function buildNearbyChords(){

    const row =
        document.getElementById(
            "nearbyRow"
        );

    row.innerHTML = "";

    if(
        !selectedPositions.size
    )
        return;

    const pcs =
        selectedPitchClasses();

    const ranked =
        CHORD_LIBRARY
        .map(chord=>{

            return {

                chord,

                score:
                    chordMatchScore(
                        chord,
                        pcs
                    )

            };

        })
        .sort(
            (a,b)=>
            b.score-a.score
        )
        .slice(0,50);

    ranked.forEach(item=>{

        const btn =
            document.createElement(
                "button"
            );

        btn.className =
            "chord-card";

        btn.innerHTML =

            "<b>"

            +

            item.chord.name

            +

            "</b><br>"

            +

            item.score;

        btn.onclick = () => {

            loadChord(
                item.chord
            );

        };

        row.appendChild(
            btn
        );

    });

}

/* =====================================================
   CHORD TO VOICING LOOKUP
===================================================== */

function findVoicings(
    chord
){

    let key =
        NOTE_NAMES[
            chord.root
        ]
        +
        chord.quality;

    return (
        VOICINGS[key]
        ||
        []
    );

}

/* =====================================================
   LOAD SPECIFIC VOICING
===================================================== */

function loadVoicing(
    voicing
){

    selectedPositions
    .clear();

    voicing.forEach(
        (fret,string)=>{

            if(
                fret<0
            ) return;

            const key =

                (5-string)

                +

                "-"

                +

                fret;

            if(
                noteData.has(
                    key
                )
            ){

                selectedPositions
                .add(key);

            }

        }
    );

    refresh();
    playSelection();

}

/* =====================================================
   LOAD CHORD
===================================================== */

function loadChord(
    chord
){

    currentChord =
        chord;

    currentVoicingList =
        findVoicings(
            chord
        );

    currentVoicingIndex =
        0;

    if(
        currentVoicingList.length
    ){

        loadVoicing(

            currentVoicingList[
                0
            ]

        );

    }

    buildVoicingRow();
}

/* =====================================================
   VOICING DISPLAY
===================================================== */

function buildVoicingRow(){

    const row =
        document.getElementById(
            "voicingRow"
        );

    row.innerHTML = "";

    if(
        !currentVoicingList
        .length
    )
        return;

    currentVoicingList
    .forEach(
        (
            voicing,
            index
        )=>{

            const btn =
                document
                .createElement(
                    "button"
                );

            btn.className =
                "chord-card";

            btn.innerHTML =

                "<b>"

                +

                (index+1)

                +

                "</b><br>"

                +

                voicing
                .map(v=>

                    v<0
                    ?"x"
                    :v

                )
                .join(" ");

            btn.onclick =
                ()=>{

                    currentVoicingIndex =
                        index;

                    loadVoicing(
                        voicing
                    );

                };

            row.appendChild(
                btn
            );

        }
    );

}

/* =====================================================
   NEXT VOICING
===================================================== */

function voicingUp(){

    if(
        !currentVoicingList
        .length
    )
        return;

    if(

        currentVoicingIndex

        <

        currentVoicingList
        .length

        -1

    ){

        currentVoicingIndex++;

        loadVoicing(

            currentVoicingList
            [
             currentVoicingIndex
            ]

        );

    }

}

/* =====================================================
   PREVIOUS VOICING
===================================================== */

function voicingDown(){

    if(
        !currentVoicingList
        .length
    )
        return;

    if(
        currentVoicingIndex
        >0
    ){

        currentVoicingIndex--;

        loadVoicing(

            currentVoicingList
            [
             currentVoicingIndex
            ]

        );

    }

}

/* =====================================================
   AUDIO
===================================================== */

const audioCtx =

new (
    window.AudioContext
    ||
    window.webkitAudioContext
)();

function midiToFreq(
    midi
){

    return (

        440

        *

        Math.pow(
            2,

            (
             midi-69
            )/12

        )

    );

}

function playSelection(){

    if(
        !selectedPositions
        .size
    )
        return;

    const now =
        audioCtx
        .currentTime;

    selectedPositions
    .forEach(key=>{

        const midi =

            noteData
            .get(key)
            .midi;

        const osc =
            audioCtx
            .createOscillator();

        const gain =
            audioCtx
            .createGain();

        osc.type =
            "triangle";

        osc.frequency.value =

            midiToFreq(
                midi
            );

        gain.gain
        .setValueAtTime(
            .12,
            now
        );

        gain.gain
        .exponentialRampToValueAtTime(
            .0001,
            now+1.3
        );

        osc.connect(
            gain
        );

        gain.connect(
            audioCtx
            .destination
        );

        osc.start(now);

        osc.stop(
            now+1.3
        );

    });

}

/* =====================================================
   CONTROLS
===================================================== */

document
.getElementById(
    "clearBtn"
)
.addEventListener(
    "click",
    ()=>{

        selectedPositions
        .clear();

        currentChord =
            null;

        currentVoicingList
            =[];

        refresh();

        document
        .getElementById(
            "voicingRow"
        )
        .innerHTML =
            "";

    }
);

document
.getElementById(
    "showNames"
)
.addEventListener(
    "change",
    refresh
);

document
.getElementById(
    "voicingUp"
)
.addEventListener(
    "click",
    voicingUp
);

document
.getElementById(
    "voicingDown"
)
.addEventListener(
    "click",
    voicingDown
);

/* keyboard */

document
.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowRight"
        ){

            voicingUp();

        }

        if(
            e.key==="ArrowLeft"
        ){

            voicingDown();

        }

    }
);

/* =====================================================
   STARTUP
===================================================== */

buildFretboard();

refresh();

</script>
</body>
</html>
